name: CI

# Builds the MuTap-Max externals via the Min-DevKit CMake on macOS (universal
# x86_64 + arm64 .mxo) and Windows (.mxe64), checking that every project under
# source/projects/ produced its external. Both this repo and the MuTap
# submodule are public, so the default GITHUB_TOKEN suffices for the
# recursive checkout.

on:
  push:
  pull_request:

jobs:
  macos:
    name: build (macos)
    runs-on: macos-latest
    steps:
      - name: Checkout (recursive — pulls min-api + MuTap)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (universal)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --parallel

      # Min-level wrapper tests (attribute defaults, block rounding, mu
      # clamping) against min-api's mock kernel. macOS only: the mock kernel is
      # Apple/Windows-specific, so this is the gate for the whole family.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify one universal external per project
        run: |
          set -euo pipefail
          expected=$(ls -d source/projects/*/ | wc -l | tr -d ' ')
          count=$(ls -d externals/*.mxo | wc -l | tr -d ' ')
          echo "built $count externals (projects: $expected)"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::expected $expected externals, got $count"; exit 1
          fi
          fail=0
          for mxo in externals/*.mxo; do
            bin="$mxo/Contents/MacOS/$(basename "$mxo" .mxo)"
            archs=$(lipo -archs "$bin")
            echo "  $(basename "$mxo"): $archs"
            [ "$archs" = "x86_64 arm64" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more externals are not universal (x86_64 arm64)"; exit 1
          fi
          echo "all externals are universal"

  windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout (recursive — pulls min-api + MuTap)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify one external (.mxe64) per project
        shell: pwsh
        run: |
          $expected = (Get-ChildItem source/projects -Directory).Count
          $ext = Get-ChildItem -Recurse externals -Filter *.mxe64
          Write-Host "built $($ext.Count) externals (projects: $expected)"
          $ext | ForEach-Object { Write-Host "  $($_.Name)" }
          if ($ext.Count -ne $expected) { throw "expected $expected .mxe64 externals, got $($ext.Count)" }
          Write-Host "all externals built"
